"$schema" = "https://starship.rs/config-schema.json"

# globals
scan_timeout = 100
command_timeout = 500
follow_symlinks = false
add_newline = true
palette = "poimandres"

# formats
format = """
$directory \
${custom.giturl}\
$git_branch\
${custom.git_worktree}\
$git_state\
$git_status\
$status\
$cmd_duration\
$line_break\
$character\
"""

right_format = """
$nodejs$golang$java$python$docker_context\
$kubernetes\
$aws\
$gcloud\
$azure\
"""

# directory
[directory]
style = "fg:sapphire"
format = "[\ueaf7 $path]($style)"
truncation_length = 3
# truncation_symbol = "…/"
truncate_to_repo = true

# git
[custom.giturl]
description = "Display symbol for remote Git server"
command = """
GIT_REMOTE=$(command git ls-remote --get-url 2> /dev/null)
case "$GIT_REMOTE" in
  *github*)    echo "\ueba1" ;;
  *gitlab*)    echo "\uf296" ;;
  *bitbucket*) echo "\uf171" ;;
  *)           echo "\uf1d2" ;;
esac
"""
when = "git rev-parse --is-inside-work-tree 2> /dev/null"
style = "overlay1"
format = "[at ]($style)[$output](text)[  on ]($style)"
require_repo = true
ignore_timeout = true

[custom.git_worktree]
description = "Show indicator when inside a git worktree"
command = """
common_dir=$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null)
git_dir=$(git rev-parse --path-format=absolute --git-dir 2>/dev/null)
if [ "$common_dir" != "$git_dir" ]; then
  echo "⛓"
fi
"""
when = "git rev-parse --is-inside-work-tree 2> /dev/null"
style = "fg:sky bg:surface1"
format = "([ $output]($style))"
require_repo = true
ignore_timeout = true

[git_branch]
symbol = "\uf418"
style = "fg:sky bg:surface1"
format = "[\ue0b6](surface1)[$symbol $branch(:$remote_branch)]($style)"

[git_state]
style = "fg:sky bg:surface1"
format = "[ \\($state( $progress_current/$progress_total)\\)]($style)"
rebase = "rebasing"
merge = "merging"
revert = "reverting"
cherry_pick = "cherry-picking"
bisect = "bisecting"
am = "am"
am_or_rebase = "am/rebase"

[git_status]
style = "fg:red bg:surface1"
format = "([ $untracked$staged$modified$renamed$conflicted$ahead_behind]($style))[\ue0b4](surface1) "
staged     = "+${count}"
modified   = "!${count}"
renamed    = "\u00bb${count}"
deleted    = "-${count}"
untracked  = "?${count}"
stashed    = "\u2261${count}"
conflicted = "\u2716${count}"
ahead      = "\u21e1${count}"
behind     = "\u21e3${count}"
diverged   = "\u21d5\u21e1${ahead_count}\u21e3${behind_count}"

# misc
[status]
disabled = false
symbol = "\u2718"
success_symbol = "\uf46f"
format = "[$symbol]($style)"
success_style = "teal"
style = "red"
map_symbol = false

[cmd_duration]
min_time = 1000
format = "  [took ](subtext1)[$duration](yellow)"

[character]
success_symbol = "[❯](teal)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[:](mauve)"

# languages
[nodejs]
symbol = "\ued44"
format = "[$symbol( $version) ]($style)"

[golang]
symbol = "\ue627"
format = "[$symbol( $version) ]($style)"
detect_files = ["go.mod"]

[java]
symbol = "\ue256"
format = "[$symbol( $version) ]($style)"

[python]
symbol = "\ue606"
format = "[$symbol( $version) ]($style)"

# cloud / contexts
[docker_context]
symbol = "\uf308"
format = "[$symbol $context ]($style)"

[kubernetes]
disabled = false
symbol = "\ue81d"
format = "[$symbol $context(/$namespace) ]($style)"

[kubernetes.context_aliases]
# "long-context" = "short"

[aws]
disabled = false
symbol = "\ue7ad"
format = "[$symbol $profile ]($style)"

[aws.profile_aliases]
# "long-profile" = "short"

[azure]
disabled = false
symbol = "\uebd8"
format = "[$symbol $subscription ]($style)"

[azure.subscription_aliases]
# "long-subscription" = "short"

[gcloud]
disabled = false
symbol = "\U000F11F6"
format = "[$symbol $domain(/$project) ]($style)"

[gcloud.project_aliases]
# "long-project" = "myproj"

